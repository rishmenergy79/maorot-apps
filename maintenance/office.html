<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוחות תחזוקה — מאורות</title>
<style>
  :root{
    --brand:#1a7fb0; --brand-2:#2ba2da; --brand-dp:#0e5c82;
    --accent:#f7941e; --accent-2:#fbb812;
    --ink:#1f2733; --muted:#68738a; --line:#dde3ea; --bg:#eef1f5;
    --ok:#0f8a5f; --bad:#c0392b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',Arial,'Noto Sans Hebrew',sans-serif;font-size:15px;line-height:1.55;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:16px 12px 60px}

  /* ---------- header ---------- */
  header{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:16px;
         box-shadow:0 1px 3px rgba(16,32,60,.08),0 6px 18px rgba(16,32,60,.06)}
  .band{height:7px;background:linear-gradient(90deg,var(--brand-2) 45%,var(--accent) 75%,var(--accent-2))}
  header .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px}
  header h1{margin:0;font-size:20px;color:var(--brand-dp);flex:1;min-width:200px}
  .sum{font-size:13.5px;color:var(--muted)}
  .sum b{color:var(--brand-dp)}
  .sum .warn{color:var(--bad)}

  /* ---------- login ---------- */
  #login{max-width:390px;margin:9vh auto;background:#fff;border-radius:16px;padding:30px 26px;
         text-align:center;box-shadow:0 20px 50px rgba(6,25,48,.14)}
  #login h2{margin:0 0 6px;font-size:19px;color:var(--brand-dp)}
  #login p{margin:0 0 20px;font-size:13.5px;color:var(--muted)}
  #login input{width:100%;margin-bottom:10px;padding:12px;font-size:16px;font-family:inherit;
               text-align:center;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}
  #login button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:9px;
                background:var(--brand-dp);color:#fff;font-size:16px;font-weight:600;
                font-family:inherit;cursor:pointer}
  #login .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
  #who button{border:none;background:none;color:var(--brand-2);font-family:inherit;
              font-size:13px;text-decoration:underline;cursor:pointer}

  /* ---------- toolbar ---------- */
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tools input{flex:1;min-width:200px;padding:10px 13px;font-size:15px;font-family:inherit;
               border:1px solid var(--line);border-radius:9px;background:#fff}
  .tools button{padding:10px 16px;border:1px solid var(--line);border-radius:9px;background:#fff;
                color:var(--brand-2);font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
  .tools button.on{background:var(--brand-dp);border-color:var(--brand-dp);color:#fff}

  /* ---------- table ---------- */
  .card{background:#fff;border-radius:12px;overflow:hidden;
        box-shadow:0 1px 3px rgba(16,32,60,.08),0 6px 18px rgba(16,32,60,.06)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:#eef3f9;color:var(--brand-dp);text-align:right;font-weight:700;
     padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f8fafc}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700}
  .pill.ok{background:#e8f7f0;color:var(--ok)}
  .pill.bad{background:#fdeeec;color:var(--bad)}
  .pill.mute{background:#eef1f5;color:var(--muted)}
  .pill.warn{background:#fff4e3;color:#b06a05}
  .act{padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;
       color:var(--brand-2);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
       white-space:nowrap;text-decoration:none;display:inline-block}
  .act.primary{background:var(--brand-dp);border-color:var(--brand-dp);color:#fff}
  .act.send{margin-top:6px;font-size:12.5px;padding:5px 10px;
            background:#fff7ec;border-color:var(--accent);color:#b06a05}
  .act.send:disabled{opacity:.5;cursor:default}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .site{font-weight:600}
  .sub{font-size:12.5px;color:var(--muted)}
  .hide{display:none}

  @media(max-width:760px){
    thead{display:none}
    tbody tr{display:block;border-bottom:1px solid var(--line);padding:12px}
    tbody td{display:flex;justify-content:space-between;gap:10px;border:none;padding:4px 0}
    tbody td::before{content:attr(data-l);color:var(--muted);font-size:12.5px}
    tbody td.acts{justify-content:flex-start;gap:8px;padding-top:10px}
    tbody td.acts::before{content:none}
  }
</style>
</head>
<body>

<!-- ============ מסך כניסה ============ -->
<div id="login">
  <h2>דוחות תחזוקה שנתית</h2>
  <p>מאורות — כל האנרגיה בשבילך</p>
  <input type="text" id="user" placeholder="שם משתמש" autocomplete="username">
  <input type="password" id="pass" placeholder="סיסמה" autocomplete="current-password" inputmode="numeric">
  <button onclick="login()">כניסה</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- ============ המסך הראשי ============ -->
<div class="wrap hide" id="app">
  <header>
    <div class="band"></div>
    <div class="in">
      <h1>דוחות תחזוקה שנתית</h1>
      <div class="sum" id="sum"></div>
      <div class="sum" id="who"></div>
    </div>
  </header>

  <div class="tools">
    <input id="q" placeholder="חיפוש לפי לקוח, אתר בפורטל, בודק או כתובת…">
    <button onclick="load()">חיפוש</button>
    <button id="fBtn" onclick="toggleFaults()">רק עם ממצאים</button>
    <button id="aBtn" onclick="toggleArchive()">ארכיון</button>
    <button onclick="load()">רענון</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>תאריך</th><th>לקוח / אתר</th><th>בודק</th>
          <th>ממצאים</th><th>תמונות</th><th>מייל</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hide" id="empty">לא נמצאו דוחות.</div>
  </div>
</div>

<script>
const BASE   = 'https://yajugfebxmehsiegoutp.supabase.co/functions/v1';
const FN     = BASE + '/list-reports';
const AUTHFN = BASE + '/auth';
const KEY    = 'sb_publishable_ciuOALr09HjUe1MnIQn3OA_XV6bQiPc';
const VIEWER = 'view.html';
const APP_VERSION = '2026.08.17.6';

/* ---------- רענון אוטומטי לגרסה חדשה ---------- */
async function checkVersion(){
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const j = await r.json();
    if(!j.version || j.version === APP_VERSION) return;
    const already = new URLSearchParams(location.search).get('v');
    if(already === j.version) return;
    const lg = document.getElementById('login');
    if(lg && !lg.classList.contains('hide')){
      const u = document.getElementById('user'), p2 = document.getElementById('pass');
      if((u && u.value) || (p2 && p2.value)) return;
    }
    location.replace(location.pathname + '?v=' + encodeURIComponent(j.version));
  }catch(e){}
}
window.addEventListener('load', () => setTimeout(checkVersion, 4000));
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkVersion(); });
setInterval(checkVersion, 10 * 60 * 1000);

let token = '', me = null, onlyFaults = false, showArchived = false, all = [];

async function call(payload){
  const r = await fetch(FN, {
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({token: token}, payload))
  });
  const j = await r.json().catch(()=>({ok:false,error:'תשובה לא תקינה מהשרת'}));
  if(!r.ok || !j.ok) throw new Error(j.error || ('שגיאה '+r.status));
  return j;
}

async function login(){
  const err  = document.getElementById('loginErr');
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;
  if(!user || !pass){ err.textContent = 'יש למלא שם משתמש וסיסמה'; return; }
  err.textContent = 'בודק…';
  try{
    const r = await fetch(AUTHFN, {
      method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body: JSON.stringify({username:user, password:pass})
    });
    const j = await r.json();
    if(!r.ok || !j.ok) throw new Error(j.error || ('שגיאה '+r.status));
    if(j.user.role !== 'office'){ err.textContent = 'למשתמש זה אין הרשאה לדף המשרד'; return; }
    token = j.token; me = j.user;
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('who').innerHTML =
      'מחובר: <b>' + me.name + '</b> · <button onclick="location.reload()">התנתקות</button>';
    load();
  }catch(e){
    err.textContent = (String(e.message).indexOf('bad credentials') > -1)
      ? 'שם משתמש או סיסמה שגויים' : ('שגיאה: ' + e.message);
  }
}
document.getElementById('pass').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
document.getElementById('user').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('pass').focus(); });

function toggleFaults(){
  onlyFaults = !onlyFaults;
  document.getElementById('fBtn').classList.toggle('on', onlyFaults);
  render();
}
function toggleArchive(){
  showArchived = !showArchived;
  document.getElementById('aBtn').classList.toggle('on', showArchived);
  document.getElementById('aBtn').textContent = showArchived ? 'חזרה לפעילים' : 'ארכיון';
  load();
}
async function setArchived(id, name, arch){
  const msg = arch
    ? 'להעביר לארכיון את הדוח של "' + name + '"?\n\nהדוח לא נמחק — הוא רק יוסתר מהרשימה, וניתן לשחזר אותו מלשונית הארכיון.'
    : 'לשחזר את הדוח של "' + name + '" לרשימה הפעילה?';
  if(!confirm(msg)) return;
  try{
    await call({action: arch ? 'archive' : 'unarchive', id: id});
    load();
  }catch(e){ alert('הפעולה נכשלה: ' + e.message); }
}

function fmtDT(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear() +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* מצב המייל: נשלח / נשלח לפני עריכה / לא נשלח */
function mailState(r){
  if(!r.email_sent) return 'never';
  const ver = r.version || 1;
  const sentVer = r.email_sent_version;
  if(sentVer != null) return (sentVer < ver) ? 'stale' : 'sent';
  if(r.email_sent_at && r.edited_at)
    return (new Date(r.email_sent_at) < new Date(r.edited_at)) ? 'stale' : 'sent';
  return (ver > 1) ? 'stale' : 'sent';
}

function mailCell(r){
  const st  = mailState(r);
  const btn = (id, name, label) =>
    '<div><button class="act send" onclick="sendMail(\'' + id + '\',\'' +
    esc(name).replace(/'/g,"\\'") + '\')">' + label + '</button></div>';

  if(st === 'never')
    return '<span class="pill mute">לא נשלח</span>' +
           btn(r.id, r.client_name, '📤 שלח דוח');

  const when = fmtDT(r.email_sent_at);
  const by   = r.email_sent_by ? ('ע"י ' + esc(r.email_sent_by)) : '';
  const info = (when || by)
    ? '<div class="sub">' + [when, by].filter(Boolean).join(' · ') + '</div>'
    : '';

  if(st === 'stale')
    return '<span class="pill warn">נשלח לפני העריכה</span>' + info +
           btn(r.id, r.client_name, '📤 שלח דוח מתוקן');

  const edited = (r.version || 1) > 1;
  return '<span class="pill ok">' + (edited ? 'דוח ערוך נשלח' : 'נשלח') + '</span>' + info;
}

async function sendMail(id, name){
  const msg = 'לשלוח את הדוח של "' + name + '" למייל המשרד?';
  if(!confirm(msg)) return;
  const btns = [...document.querySelectorAll('.act.send')];
  btns.forEach(b => b.disabled = true);
  try{
    const r = await fetch(BASE + '/send-report', {
      method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body: JSON.stringify({id: id, sentBy: (me && me.name) || ''})
    });
    const txt = await r.text();
    if(!r.ok) throw new Error('(' + r.status + ') ' + txt.slice(0,200));
    alert('הדוח נשלח למייל המשרד.');
    load();
  }catch(e){
    alert('השליחה נכשלה: ' + e.message);
    btns.forEach(b => b.disabled = false);
  }
}

async function load(){
  const rows = document.getElementById('rows');
  rows.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#68738a">טוען…</td></tr>';
  try{
    const j = await call({search: document.getElementById('q').value, showArchived: showArchived});
    all = j.reports || [];
    document.getElementById('sum').innerHTML = showArchived
      ? '<b>' + j.stats.total + '</b> דוחות בארכיון'
      : 'סה"כ <b>' + j.stats.total + '</b> דוחות · החודש <b>' + j.stats.thisMonth + '</b> · ' +
        'עם ממצאים <span class="warn"><b>' + j.stats.withFaults + '</b></span> ' +
        '(' + j.stats.faultsSum + ' סעיפים)';
    render();
  }catch(e){
    rows.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#c0392b">' +
                     'שגיאה בטעינה: ' + e.message + '</td></tr>';
  }
}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(d){ return d ? d.split('-').reverse().join('/') : '—'; }

function render(){
  const list = onlyFaults ? all.filter(r => (r.faults_count||0) > 0) : all;
  const tb   = document.getElementById('rows');
  document.getElementById('empty').textContent =
    showArchived ? 'הארכיון ריק.' : 'לא נמצאו דוחות.';
  document.getElementById('empty').classList.toggle('hide', list.length > 0);
  tb.innerHTML = list.map(r => {
    const faults = r.faults_count || 0;
    return '<tr>' +
      '<td data-l="תאריך">' + fmt(r.inspection_date) + '</td>' +
      '<td data-l="לקוח"><span class="site">' + esc(r.client_name) + '</span>' +
        (r.portal_site ? '<div class="sub">' + esc(r.portal_site) + '</div>' : '') + '</td>' +
      '<td data-l="בודק">' + esc(r.user_name || r.inspector) +
        ((r.version && r.version > 1)
          ? '<div class="sub">נערך ע"י ' + esc(r.edited_by_name || '') +
            ' · גרסה ' + r.version + '</div>'
          : '') + '</td>' +
      '<td data-l="ממצאים">' + (faults
          ? '<span class="pill bad">' + faults + '</span>'
          : '<span class="pill ok">תקין</span>') + '</td>' +
      '<td data-l="תמונות">' + (r.photos_count || 0) + '</td>' +
      '<td data-l="מייל">' + mailCell(r) + '</td>' +
      '<td class="acts">' +
        (r.report_url
          ? '<a class="act primary" target="_blank" href="' + VIEWER + '#' +
            encodeURIComponent(r.report_url) + '">דוח מלא</a>'
          : '') +
        (r.waze_link
          ? '<a class="act" target="_blank" href="' + esc(r.waze_link) + '">ניווט</a>'
          : '') +
        (!showArchived
          ? '<a class="act" target="_blank" href="index.html#edit=' + r.id + '">עריכה</a>'
          : '') +
        '<button class="act" onclick="setArchived(\'' + r.id + '\',\'' +
          esc(r.client_name).replace(/'/g,"\\'") + '\',' + (showArchived ? 'false' : 'true') +
          ')">' + (showArchived ? 'שחזור' : 'ארכוב') + '</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}
</script>
</body>
</html>
